
services:
  - type: web
    name: ai-lead-qualification-system
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        sync: false